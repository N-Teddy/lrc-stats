appId: com.lrc.stats
productName: LRC Stats
directories:
  output: build
  buildResources: assets
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - db/**/*
  - images/**/*
linux:
  target:
    - AppImage
    - deb
  category: Office
win:
  target: nsis
mac:
  target: dmg
  category: public.app-category.office-business
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
extraResources:
  - from: db/
    to: db/
  - from: images/
    to: images/
